<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div style="display: flex;" class="para">
        <p">Rafiliwe</p>
        <p>Ismael</p>
    </div>

    <form action="">
        <div class="upper">
            <label for="p-name">Product Name:</label><br>
            <input type="text" name="p-name" placeholder="Enter product name"><br>
            <label for="p-description">Product Description:</label><br>
            <textarea type="text" rows="10" cols="40" id="pdescription" name="p-description"
                placeholder="Enter product descritions"></textarea>
        </div>
        <div class="lowwer">
            <div class="price">
                <label for="price">Price:</label>
                <input type="number" id="price" name="price" min="0" step="0.01" placeholder="Enter price" />
            </div>
            <div class="quantity">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" name="quantity" min="1" step="1" placeholder="Enter quantity" />
            </div>
        </div>
    </form>
</body>

</html>
